<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Digital Clock</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div id="clockContainer" class="flex justify-center items-center h-screen bg-gradient-to-r from-purple-600 via-pink-500 to-blue-500 p-20">
        <div id="clock" class="text-6xl font-sans font-medium px-24 py-10 tracking-wide text-white/40 bg-white/20 backdrop-blur-md
                 border border-white/30 shadow-lg rounded-xl
                 ">00:00:00</div>
    </div>
    <script src="script.js"></script>
</body>
</html>

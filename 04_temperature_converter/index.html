<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Temperature Converter</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Hides number inputs' default up/down arrows for a cleaner look */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen font-sans">
    <div class="bg-white p-8 rounded-xl shadow-xs  border border-gray-100 ">
        <h1 class="text-3xl font-semibold text-gray-900 tracking-tight mb-6">Temperature Converter</h1>

        <div class="flex items-center gap-4">
            <!-- Fahrenheit Input -->
            <div class="relative border border-gray-200 rounded-lg p-4 w-48 bg-white focus-within:border-b-blue-500 transition-colors">
                <span class="absolute top-2  right-3 text-xs font-medium text-gray-400">°F</span>
                <input type="number" id="fahrenheit" value="37.4" class="w-full bg-transparent outline-none text-center text-gray-900 font-semibold text-2xl" step="any">
            </div>

            <div class="text-xl text-gray-400 select-none">⇄</div>

            <!-- Celsius Input -->
            <div class="relative border border-gray-200 rounded-lg p-4 w-48 bg-white focus-within:border-b-blue-500 transition-colors">
                <span class="absolute top-2  right-3 text-xs font-medium text-gray-400">°C</span>
                <input type="number" id="celsius" value="3" class="w-full bg-transparent outline-none text-center text-gray-900 font-semibold text-2xl" step="any">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

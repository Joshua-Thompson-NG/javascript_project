<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todo Application - No Local Storage</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="max-w-md bg-white p-8 rounded-xl shadow-lg">
        <h1 class="text-4xl font-bold mb-4 text-center">Todo List</h1>

        <div class="flex flex-col gap-4">
            <input type="text" id="todoInput" placeholder="Add a new task..." class="w-full px-4 py-2 mb-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-600">

            <button class="px-4 py-2 w-full bg-indigo-500 text-white font-medium rounded-xl cursor-pointer hover:bg-indigo-600 active:scale-90 focus:outline-none focu-visible:ring-2 focus-visible:ring-indigo-400 focus-visible:ring-offset-2 transition-all duration-150 " id="addBtn">Add Task</button>
        </div>

        <ul id="todoList" class="mt-6 space-y-2">

        </ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
